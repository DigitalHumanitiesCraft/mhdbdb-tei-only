<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Seite nicht gefunden - MHDBDB</title>
    <script>
        // GitHub Pages SPA redirect
        // Converts path-based URLs to query parameters so index.html can handle routing
        // e.g., /mhdbdb-tei-only/lemma/879 → /mhdbdb-tei-only/lemma/?p=/879
        var pathSegments = window.location.pathname.split('/');
        var repo = '';

        // Detect if we're in a subdirectory deployment (e.g., /mhdbdb-tei-only/)
        // Find the 'lemma' segment and reconstruct
        var lemmaIdx = pathSegments.indexOf('lemma');
        if (lemmaIdx !== -1 && lemmaIdx < pathSegments.length - 1) {
            // Everything before 'lemma' is the base path
            var basePath = pathSegments.slice(0, lemmaIdx).join('/');
            // Everything after 'lemma' is the lemma ID
            var lemmaPath = pathSegments.slice(lemmaIdx + 1).join('/');
            // Redirect to lemma/index.html with the ID as a query param
            var newUrl = basePath + '/lemma/?id=' + encodeURIComponent(lemmaPath);
            window.location.replace(newUrl + window.location.search.slice(1) + window.location.hash);
        } else {
            // Not a lemma URL: show 404
            // The site lives under /mhdbdb-tei-only/ on Pages and under / on the dev server;
            // "/" alone led to the domain root, not to the MHDBDB.
            var home = window.location.pathname.indexOf('/mhdbdb-tei-only/') === 0 ? '/mhdbdb-tei-only/' : '/';
            document.write('<h1>Seite nicht gefunden</h1><p><a href="' + home + '">Zurück zur MHDBDB</a></p>');
        }
    </script>

</script>
