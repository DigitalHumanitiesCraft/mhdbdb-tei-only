name: Schema Validation

# Runs on PRs that touch schema/, tei/, authority-files/, or the
# validate-corpus.py script itself. Performs:
#
#   1. RNC→RNG sync check (P2-14): regenerates the .rng files from
#      their .rnc sources and fails if the committed .rng differs
#      from the regenerated output — catches "edited RNC, forgot to
#      regenerate RNG" drift.
#
#   2. Full two-stage RelaxNG validation (P2-13): validates all 666
#      corpus files and all 8 authority files against tei_all.rng
#      (Stage 1) and mhdbdb.rng / mhdbdb-authority.rng (Stage 2).
#      Fails when any Stage-2 check fails.
#
# The script (scripts/audit/validate-corpus.py) exits 0 if Stage-2
# is clean, even if Stage-1 has the known #30-baseline fails. Pushes
# that would add new Stage-1 failures are NOT auto-blocked — they
# get a warning in the CI log instead. Stage-2 is the hard gate.

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'tei/**'
      - 'authority-files/**'
      - 'scripts/audit/validate-corpus.py'
      - '.github/workflows/schema-validation.yml'
  # Manual trigger for ad-hoc validation runs (e.g. verifying CI setup,
  # or running a full validation after a direct-to-main schema change
  # that wouldn't otherwise fire the pull_request trigger).
  workflow_dispatch:

# Cancel in-progress runs when a PR gets a new push
concurrency:
  group: schema-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --quiet lxml rnc2rng

      - name: Download tei_all.rng
        # tei_all.rng is gitignored in this repo (see schema/README.md).
        # Every run fetches it fresh from the TEI Consortium.
        run: |
          curl -sSL \
            "https://tei-c.org/release/xml/tei/custom/schema/relaxng/tei_all.rng" \
            -o schema/tei_all.rng

      - name: Verify TEI P5 version pin
        # Catches silent drift between local dev (where tei_all.rng is
        # cached at whatever version was downloaded last) and CI (which
        # always fetches the current "latest" from tei-c.org). If TEI
        # publishes a new P5 version, this step fails and forces us to
        # bump the pin explicitly in schema/README.md + here. That is
        # the right default — new TEI versions may change grammar and
        # should not silently change validation semantics.
        #
        # NOTE: the version header in tei_all.rng contains a literal
        # NBSP (U+00A0, UTF-8 bytes C2 A0) between "Version" and the
        # number, so a naive `grep -oE 'Version [0-9.]+'` with a
        # regular space does NOT match. Python's re.search with \s
        # handles that correctly since Python 3.
        run: |
          TEI_VERSION=$(python3 -c "import re; m = re.search(r'TEI Edition: P5 Version\s+([0-9]+\.[0-9]+\.[0-9]+)', open('schema/tei_all.rng', encoding='utf-8').read()); print(m.group(1) if m else '')")
          EXPECTED="4.11.0"
          if [ -z "$TEI_VERSION" ]; then
            echo "::error title=TEI P5 version pin::Could not extract TEI P5 version from schema/tei_all.rng. Header format may have changed upstream."
            exit 1
          fi
          if [ "$TEI_VERSION" != "$EXPECTED" ]; then
            echo "::error title=TEI P5 version drift::CI downloaded TEI P5 Version $TEI_VERSION, but the repo is pinned to $EXPECTED (see schema/README.md). Either bump the pin in schema/README.md + this workflow step, or investigate the tei-c.org URL if a version regression happened."
            exit 1
          fi
          echo "TEI P5 version: $TEI_VERSION (matches pin)"

      - name: Regenerate RNG from RNC (P2-14 drift check)
        run: |
          python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng
          python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng

      - name: Fail if committed .rng differs from regenerated .rng
        run: |
          if ! git diff --exit-code schema/mhdbdb.rng schema/mhdbdb-authority.rng; then
            echo "::error title=RNG drift::Committed .rng files are out of sync with their .rnc sources. Run 'python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng && python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng' locally and commit the result."
            exit 1
          fi

      - name: Validate corpus and authority files (P2-13)
        run: python scripts/audit/validate-corpus.py --fail-fast
