# No-CDN-Gate: committete HTML-Seiten dürfen keine externen <script src>
# und keine externen <link> tragen, die einen Abruf ausloesen. Runtime-
# Bibliotheken sind vendored (assets/vendor/, pako/dexie
# 2026-07, Prism #78). Eigener leichter Workflow statt data-integrity.yml,
# damit HTML-Edits nicht den vollen Index-Rebuild triggern.
#
# Lokales Gegenstück (inkl. Laufzeit-Check window.pako/Dexie):
# testing/tests/vendor.spec.js
#
# Seit 28.07. läuft hier ein zweites Gate: user-sichtbare Strings dürfen
# keine Em-Dashes tragen (#140). KZW meldet sie wiederholt aus dem Betrieb,
# zuletzt im Hapax-Werkzeug. Kommentare bleiben ausgenommen. Der Workflow-
# Name bleibt no-cdn-check, damit vorhandene Check-Referenzen halten.
#
# Seit 01.08. ein drittes: die beiden Inventar-Tabellen in
# docs/DEVELOPMENT.md müssen ihre Verzeichnisse vollständig auflisten,
# "Test File Inventory" gegen testing/tests/ und "Audit Scripts Reference"
# gegen scripts/audit/ (#329; dort fehlten zehn von dreißig bzw. elf von
# zweiundzwanzig). Auch das ist ein reiner stdlib-Check ohne Rebuild und
# gehört deshalb hierher. data-integrity.yml wäre der falsche Ort, aber
# nicht wegen seiner Trigger (es horcht ohnehin auf scripts/audit/**),
# sondern wegen seiner Kosten: dort hinge das Gate hinter Index-Rebuild und
# RelaxNG über 667 Dateien, und es liefe bei jedem tei/-Commit mit,
# während eine Änderung an testing/tests/ es gar nicht auslöste.
#
# Seit 01.10.2026 ein viertes: die dokumentierten Zahlen gegen die Daten
# (doc-count-audit.py, #382/#398), zusätzlich zu data-integrity.yml.
# Begründung am Schritt.
#
# Die Trigger-Pfade nennen scripts/audit/** als Glob und nicht die einzelnen
# Skripte. Das ist seit dem zweiten Inventar Pflicht und nicht Bequemlichkeit:
# ein NEU angelegtes Audit-Skript muss den Lauf auslösen, sonst fällt genau
# der Fall durch, den das Gate fangen soll. Dieselbe Konvention und dieselbe
# Begründung stehen in data-integrity.yml (Review #146).
#
# Nebenwirkung, bewusst in Kauf genommen: weil data-integrity.yml denselben
# Glob trägt, startet jede Änderung in scripts/audit/ auch dort einen Lauf,
# ohne dass die Gates von hier darin ausgeführt würden.
#
# Seit 02.08. prüft das Em-Dash-Gate zusätzlich Markdown, aber nur die
# Zeilen, die ein PR hinzufügt (#292). Deshalb braucht dieser Workflow
# eine Diff-Base, die es hier wie in data-integrity.yml (#154) gibt; wie
# sie bestimmt wird, steht am Schritt selbst. Ein
# Vollscan über Markdown kam nicht in Frage: rund 470 Zeilen im Bestand
# tragen einen Em-Dash, und die Schreibregel gilt für neuen und
# überarbeiteten Text, nicht rückwirkend.

name: no-cdn-check

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'playground/**'
      - 'lemma/**'
      - 'assets/css/**'
      - 'scripts/audit/**'
      - 'testing/tests/**'
      - '**.md'
      - '.github/workflows/no-cdn-check.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'playground/**'
      - 'lemma/**'
      - 'assets/css/**'
      - 'scripts/audit/**'
      - 'testing/tests/**'
      - '**.md'
      - '.github/workflows/no-cdn-check.yml'
  workflow_dispatch:

concurrency:
  group: no-cdn-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # fetch-depth: 2, damit der Diff-Base-Schritt unten den ersten
        # Elternteil des Merge-Refs lesen kann. Mit der Voreinstellung 1
        # kappt die shallow-Grenze die Elternliste, und `HEAD^1` scheitert.
        #
        # sparse-checkout laesst die Korpusdateien und die Index-Archive
        # weg (#564): tei/ ist 1.366 von 1.651 MB des Baums, und der
        # Checkout war mit median 117 s der groesste Posten dieses Jobs.
        # Die Action holt bei sparse-checkout nur die Blobs der
        # ausgecheckten Pfade (--filter=blob:none).
        # Bewusst eine Ausschlussliste und keine Positivliste: ein neues
        # Verzeichnis ist damit im Baum und wird von den Gates gesehen.
        # Gemessen 10.10.2026: check-no-cdn.py (29 Dateien) und der
        # Vollscan von check-no-em-dash.py (74) sehen im sparse-Baum
        # dieselben Dateien wie im vollen; tei/ und data/ stehen in ihren
        # eigenen TOP_LEVEL_SKIP. ingest/, sources/ und examples/ bleiben
        # drin: dort liegen HTML-Pruefseiten und Markdown, die beide Gates
        # lesen.
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/tei/*.tei.xml
            !/data/*.json.gz
          sparse-checkout-cone-mode: false

      - name: Diff-Base bestimmen (#292)
        id: base
        # Die Shell-Zeilen sind wortgleich zu data-integrity.yml (#154),
        # damit beide Workflows dieselbe Basis meinen; die Kommentare
        # darin unterscheiden sich, weil dort das Bump-Gate haengt.
        #
        # Bei pull_request ist die Base der erste Elternteil des
        # ausgecheckten Merge-Refs. Die beiden naheliegenden Alternativen
        # sind beide falsch, und zwar gemessen, nicht vermutet:
        #
        #  - Der aktuelle Tip von $GITHUB_BASE_REF laeuft weiter, waehrend
        #    der Lauf wartet. Im Lauf 30744220171 zu PR #337 war ausgecheckt
        #    "Merge 52a83d3 into b8b44eb", die Base aber d835e8f, weil #338
        #    98 Sekunden nach dem Auslösen gemergt wurde.
        #  - `pull_request.base.sha` haengt hinterher: im Folgelauf
        #    30744745366 war ausgecheckt "Merge 27cf4d9 into d835e8f", die
        #    base.sha aber weiter b8b44eb.
        #
        # In beiden Faellen galten Zeilen fremder, laengst gemergter PRs als
        # von diesem hinzugefuegt (im ersten Lauf drei aus
        # docs/DEVELOPMENT.md; gruen war er nur, weil keine davon einen
        # Em-Dash trug). Die Richtung ist fail-closed, aber ein Gate, das
        # fremde Prosa anmahnt, treibt genau die rueckwirkende Umschreibung,
        # die die Hausregel verbietet.
        #
        # Achtung, falls hier je eine Merge-Queue dazukommt: `merge_group`
        # faellt durch beide Zweige unten durch, BASE bliebe leer, und das
        # Markdown-Gate wuerde still uebersprungen (::notice-Zweig). Wer den
        # Trigger ergaenzt, muss diesen Schritt also mitbehandeln.
        #
        # Der erste Elternteil ist per Konstruktion der Stand, gegen den
        # gemergt wurde, und braucht keinen Netzzugriff. Leerer sha
        # (workflow_dispatch, Force-Push-Edge) -> Markdown wird
        # uebersprungen, der Vollscan ueber HTML/JS/CSS laeuft unveraendert.
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git rev-parse --verify --quiet HEAD^1) || BASE=""
            if [ -z "$BASE" ]; then
              echo "::error title=Diff-Base::Erster Elternteil des Merge-Refs nicht lesbar (fetch-depth zu klein?)."
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
              BASE=""
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "Diff-Base: ${BASE:-<keine>}"

      - name: No external script src or link href in committed HTML (stdlib only)
        run: python3 scripts/audit/check-no-cdn.py

      - name: Em-Dash-Gate Selbsttest (#140/#292)
        run: python3 scripts/audit/check-no-em-dash.py --selftest

      - name: Keine Em-Dashes in HTML/JS/CSS und neuer Markdown-Prosa (#140/#292)
        run: |
          if [ -z "${{ steps.base.outputs.sha }}" ]; then
            echo "::notice title=Em-Dash-Gate::Keine Diff-Base bestimmbar (workflow_dispatch/Force-Push), Markdown ungeprüft."
            python3 scripts/audit/check-no-em-dash.py
          else
            python3 scripts/audit/check-no-em-dash.py --diff-base "${{ steps.base.outputs.sha }}"
          fi

      - name: Inventar-Gate Selbsttest (#329)
        run: python3 scripts/audit/check-doc-inventories.py --selftest

      - name: Specs und Audit-Skripte stehen in ihren Inventaren (#329)
        run: python3 scripts/audit/check-doc-inventories.py

      # Seit 01.10.2026 auch hier, nicht nur in data-integrity.yml. Dort
      # loesen docs/** und *.html keinen Lauf aus, und das war als Grenze
      # dokumentiert: eine Zahl, die ohne Lauf dieses Gates aus dem Tritt
      # geriet, wurde erst vom naechsten Daten-PR bemerkt, der damit nichts
      # zu tun hatte (so bei #503 und #505: ein Code-PR verschob eine damals
      # noch gezaehlte Modulzahl). Der Grund, das Gate nicht hierher zu
      # legen, war lxml; das Skript zaehlt seitdem mit ElementTree und ist
      # stdlib-only. Lokal gemessen am 01.10.2026: 5,4 Sekunden fuer den
      # ganzen --check.
      # doc-count-audit.py zaehlt die Korpusdateien nur ueber corpus_files(),
      # also ueber die DATEINAMEN in tei/ (Inhalt liest es nur aus
      # authority-files/). Im sparse-Baum fehlen sie, und das Skript meldet
      # dann "Korpus-Dateien 0", ueberspringt alle neun corpus_files-Paare
      # ("pruefen derzeit nichts") und endet mit Exit 0: ein stilles Gruen,
      # gemessen im Lauf 38047149367 auf dem Messzweig. Deshalb leere
      # Platzhalter mit den Namen aus dem Git-Baum. Mutationsprobe am
      # 10.10.2026 im sparse-Klon: 667 -> 665 in docs/INDEX.md ist mit
      # Platzhaltern rot (Exit 1), ohne tei/ gruen (Exit 0).
      - name: tei/-Dateinamen fuer doc-count-audit (#564)
        run: |
          mkdir -p tei
          git ls-tree -r --name-only HEAD tei/ | while IFS= read -r f; do : > "$f"; done
          erwartet=$(git ls-tree -r --name-only HEAD tei/ | grep -c '\.tei\.xml$')
          vorhanden=$(find tei -maxdepth 1 -name '*.tei.xml' | wc -l)
          echo "tei/*.tei.xml: $vorhanden Platzhalter, $erwartet im Git-Baum"
          if [ "$erwartet" -lt 1 ] || [ "$erwartet" != "$vorhanden" ]; then
            echo "::error title=Platzhalter::Platzhalter und Git-Baum weichen ab oder tei/ ist leer."
            exit 1
          fi

      - name: Dokumentierte Zahlen gegen die Daten (#382/#398)
        run: python3 scripts/audit/doc-count-audit.py --check
