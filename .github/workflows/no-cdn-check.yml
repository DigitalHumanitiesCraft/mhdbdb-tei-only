# No-CDN-Gate: committete HTML-Seiten dürfen keine externen <script src>
# tragen — Runtime-Bibliotheken sind vendored (assets/vendor/, pako/dexie
# 2026-07, Prism #78). Eigener leichter Workflow statt data-integrity.yml,
# damit HTML-Edits nicht den vollen Index-Rebuild triggern.
#
# Lokales Gegenstück (inkl. Laufzeit-Check window.pako/Dexie):
# testing/tests/vendor.spec.js
#
# Seit 28.07. läuft hier ein zweites Gate: user-sichtbare Strings dürfen
# keine Em-Dashes tragen (#140). KZW meldet sie wiederholt aus dem Betrieb,
# zuletzt im Hapax-Werkzeug. Kommentare bleiben ausgenommen. Der Workflow-
# Name bleibt no-cdn-check, damit vorhandene Check-Referenzen halten.
#
# Seit 01.08. ein drittes: die beiden Inventar-Tabellen in
# docs/DEVELOPMENT.md müssen ihre Verzeichnisse vollständig auflisten,
# "Test File Inventory" gegen testing/tests/ und "Audit Scripts Reference"
# gegen scripts/audit/ (#329; dort fehlten zehn von dreißig bzw. elf von
# zweiundzwanzig). Auch das ist ein reiner stdlib-Check ohne Rebuild und
# gehört deshalb hierher. data-integrity.yml wäre der falsche Ort, aber
# nicht wegen seiner Trigger (es horcht ohnehin auf scripts/audit/**),
# sondern wegen seiner Kosten: dort hinge das Gate hinter Index-Rebuild und
# RelaxNG über 667 Dateien, und es liefe bei jedem tei/-Commit mit,
# während eine Änderung an testing/tests/ es gar nicht auslöste.
#
# Die Trigger-Pfade nennen scripts/audit/** als Glob und nicht die einzelnen
# Skripte. Das ist seit dem zweiten Inventar Pflicht und nicht Bequemlichkeit:
# ein NEU angelegtes Audit-Skript muss den Lauf auslösen, sonst fällt genau
# der Fall durch, den das Gate fangen soll. Dieselbe Konvention und dieselbe
# Begründung stehen in data-integrity.yml (Review #146).
#
# Nebenwirkung, bewusst in Kauf genommen: weil data-integrity.yml denselben
# Glob trägt, startet jede Änderung in scripts/audit/ auch dort einen Lauf,
# ohne dass die Gates von hier darin ausgeführt würden.

name: no-cdn-check

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'playground/**'
      - 'lemma/**'
      - 'assets/css/**'
      - 'scripts/audit/**'
      - 'testing/tests/**'
      - 'docs/DEVELOPMENT.md'
      - '.github/workflows/no-cdn-check.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'assets/js/**'
      - 'playground/**'
      - 'lemma/**'
      - 'assets/css/**'
      - 'scripts/audit/**'
      - 'testing/tests/**'
      - 'docs/DEVELOPMENT.md'
      - '.github/workflows/no-cdn-check.yml'
  workflow_dispatch:

concurrency:
  group: no-cdn-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: No external script src in committed HTML (stdlib only)
        run: python3 scripts/audit/check-no-cdn.py

      - name: Em-Dash-Gate Selbsttest (#140)
        run: python3 scripts/audit/check-no-em-dash.py --selftest

      - name: Keine Em-Dashes in user-sichtbarem Text (#140)
        run: python3 scripts/audit/check-no-em-dash.py

      - name: Inventar-Gate Selbsttest (#329)
        run: python3 scripts/audit/check-doc-inventories.py --selftest

      - name: Specs und Audit-Skripte stehen in ihren Inventaren (#329)
        run: python3 scripts/audit/check-doc-inventories.py
