name: Data Integrity

# Ein konsolidiertes Daten-Gate (#125): prueft Quellen UND abgeleitete
# Schicht (Indexe, variants.xml) in einem Job, Steps von billig nach
# teuer (fail fast). Konsolidiert das fruehere index-version-check.yml
# (Step 1) und schema-validation.yml (Steps 2-3, 7-8).
#
#   0. Diff-Base bestimmen (PR: origin/<base>, Push: event.before) —
#      Grundlage fuer Step 1b und die Change-Detection in Step 6c.
#   1. Index-Versions-Konstanten: Build-Skripte und corpus-loader.js
#      muessen dieselbe Version nennen, sonst greift die Cache-
#      Invalidierung nicht (#47.3).
#   1b. Versions-Bump-Gate (#154): hat sich der dekomprimierte Inhalt
#      von corpus-/authority-index gegenueber der Diff-Base geaendert,
#      MUSS der version-String mitgebumpt sein — sonst invalidiert der
#      Dexie-Cache nicht und wiederkehrende Nutzer behalten bis zu
#      30 Tage den alten Index. MUSS VOR Step 6 laufen (der Rebuild
#      dort ueberschreibt data/*.json.gz im Working Tree).
#   2. RNC->RNG sync check (P2-14).
#   3. TEI-P5-Versions-Pin fuer tei_all.rng.
#   4. Freshness variants.xml: extract-variants.py --apply muss die
#      committete Datei byte-identisch reproduzieren, sonst wurde nach
#      einer Korpus-Aenderung die Regenerierung vergessen. MUSS als
#      blockierender Step VOR Step 6 stehen: der Index-Vergleich kann
#      variants-Drift prinzipiell nicht erkennen (der Rebuild nutzt
#      dieselbe committete variants.xml und matcht). Nie auf advisory
#      herunterstufen.
#   5. Freshness API (#45): build-api.py muss das committete api/
#      byte-identisch reproduzieren (plain JSON, kein gzip — daher
#      reicht git diff). MUSS VOR Step 6 laufen: der Index-Rebuild
#      dort laesst data/*.json.gz mit potenziell anderen gz-Bytes
#      zurueck (je zlib-Build), was den build-api-Pre-flight
#      ("data/ muss clean sein") grundlos ausloesen wuerde.
#   6. Freshness Indexe (Rebuild-and-Compare): beide Indexe frisch
#      bauen, DEKOMPRIMIERTEN Inhalt mit dem committeten Stand
#      vergleichen (gzip-Bytes koennen je zlib-Build variieren).
#      Traegt nur, weil die Builds seit #125 deterministisch sind
#      (kein generatedAt, sorted glob, gzip mtime=0).
#   6b. Naming-Index Konsistenz (#152): source.commit-Provenienz
#      vorhanden + alle works[].sigle existieren als tei/<SIG>.tei.xml
#      (ein Sigle-Rename braeche den Reader-Link sonst still als No-op).
#      Offline und billig, laeuft immer.
#   6c. Freshness naming-index (#152): Rebuild aus dem im Index
#      gepinnten source.commit muss den committeten Stand reproduzieren
#      (deterministisch: generatedAt = Committer-Datum des Pins).
#      Laeuft NUR, wenn naming-Pfade sich gegenueber der Diff-Base
#      geaendert haben — der Fetch geht an ein externes Repo
#      (lindabeutel/Naming-analysis), und externe Netz-Abhaengigkeit
#      auf jedem Daten-PR widerspraeche dem #125-Prinzip.
#   7. Authority cross-reference integrity (#44/#115/#152): dangling
#      Refs ausserhalb lexicon.xml brechen den Build; lexicon.xml wird
#      gegen die gepinnte Backfill-Baseline im Audit-Skript gegated
#      (Wachstum = rot, tolerierter Altbestand = gruen). Vor der
#      RelaxNG-Validierung, weil deutlich billiger (plain parse).
#   8. Zweistufige RelaxNG-Validierung (P2-13): Stage 2
#      (mhdbdb.rng / mhdbdb-authority.rng) ist das harte Gate;
#      Stage-1-Baseline-Fails (#30) sind nur Warnungen.
#
# Dependencies sind in requirements.txt gepinnt (CI und lokal dieselben
# Versionen): eine neue lxml-Serialisierung wuerde sonst in Step 4 als
# falscher Drift-Alarm erscheinen (variants.xml ist lxml-serialisiert;
# die Indexe sind reines json.dumps), eine neue rnc2rng-Version in
# Step 2. Bei Pin-Bump lokal `pip install -r requirements.txt` und
# variants.xml einmal regenerieren.

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'tei/**'
      - 'authority-files/**'
      - 'data/corpus-index.json.gz'
      - 'data/authority-index.json.gz'
      - 'data/naming-index.json.gz'
      - 'api/**'
      - '!api/index.html'
      - 'scripts/build-corpus-index.py'
      - 'scripts/build-authority-index.py'
      - 'scripts/build-api.py'
      - 'scripts/mhg_normalizer.py'
      # Globs statt Einzeldateien: jedes hier ausgefuehrte Gate-Skript
      # soll seinen eigenen Aenderungs-Trigger haben (Review #146).
      - 'scripts/sync/**'
      - 'scripts/audit/**'
      - 'scripts/ingest/naming/**'
      - 'assets/js/lib/corpus-loader.js'
      - 'requirements.txt'
      - '.github/workflows/data-integrity.yml'
  # Direct-to-main pushes also trigger the workflow (Branch-Protection
  # ist historisch umgangen worden, z.B. WZB-Merge 2026-05-06).
  push:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'tei/**'
      - 'authority-files/**'
      - 'data/corpus-index.json.gz'
      - 'data/authority-index.json.gz'
      - 'data/naming-index.json.gz'
      - 'api/**'
      - '!api/index.html'
      - 'scripts/build-corpus-index.py'
      - 'scripts/build-authority-index.py'
      - 'scripts/build-api.py'
      - 'scripts/mhg_normalizer.py'
      - 'scripts/sync/**'
      - 'scripts/audit/**'
      - 'scripts/ingest/naming/**'
      - 'assets/js/lib/corpus-loader.js'
      - 'requirements.txt'
      - '.github/workflows/data-integrity.yml'
  workflow_dispatch:

concurrency:
  group: data-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Checkout ~2 min (grosses Repo) + Index-Builds (~5 min lokal) +
    # RelaxNG-Validierung. 45 min lassen Luft fuer langsame Runner;
    # nach den ersten realen Laeufen ggf. nachjustieren.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Diff-Base bestimmen (#154/#152)
        id: base
        # Liefert sha = Vergleichsstand fuer das Versions-Bump-Gate und
        # die naming-Change-Detection. Leerer sha (workflow_dispatch,
        # Force-Push-Edge) -> Bump-Gate wird uebersprungen, naming-Check
        # laeuft konservativ.
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE=$(git rev-parse FETCH_HEAD)
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
              BASE=""
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          if [ -z "$BASE" ] \
             || ! git diff --quiet "$BASE" HEAD -- data/naming-index.json.gz scripts/ingest/naming/; then
            echo "naming_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "naming_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Diff-Base: ${BASE:-<keine>} / naming_changed siehe Output"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Index version consistency (#47.3)
        run: python scripts/audit/check-index-versions.py

      - name: Index-Versions-Bump-Gate (#154)
        # MUSS vor dem Index-Rebuild (Step 6) laufen: der ueberschreibt
        # data/*.json.gz im Working Tree.
        run: |
          if [ -z "${{ steps.base.outputs.sha }}" ]; then
            echo "::notice title=Versions-Bump-Gate::Kein Diff-Base bestimmbar (workflow_dispatch/Force-Push) — Gate uebersprungen."
          else
            python scripts/audit/check-index-version-bump.py --base "${{ steps.base.outputs.sha }}"
          fi

      - name: Regenerate RNG from RNC (P2-14 drift check)
        run: |
          python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng
          python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng

      - name: Fail if committed .rng differs from regenerated .rng
        run: |
          if ! git diff --exit-code schema/mhdbdb.rng schema/mhdbdb-authority.rng; then
            echo "::error title=RNG drift::Committete .rng-Dateien sind nicht synchron mit ihren .rnc-Quellen. Lokal 'python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng && python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng' ausfuehren und das Ergebnis committen."
            exit 1
          fi

      - name: Verify TEI P5 version pin
        # tei_all.rng is committed to the repo (schema/tei_all.rng, see
        # schema/README.md) — NO download from tei-c.org at build time, so
        # the CI does not depend on upstream reachability (reproducible
        # builds, #125; previously a tei-c.org outage failed every run).
        # This step is a sanity check that the committed schema still
        # carries the pinned version; it catches an accidental replacement
        # with a different P5 version. Upgrading P5 is a deliberate act:
        # replace schema/tei_all.rng and bump EXPECTED + schema/README.md.
        #
        # NOTE: the version header in tei_all.rng contains a literal
        # NBSP (U+00A0, UTF-8 bytes C2 A0) between "Version" and the
        # number, so a naive `grep -oE 'Version [0-9.]+'` with a
        # regular space does NOT match. Python's re.search with \s
        # handles that correctly since Python 3.
        run: |
          if [ ! -f schema/tei_all.rng ]; then
            echo "::error title=TEI schema missing::schema/tei_all.rng fehlt im Repo. Die Datei muss committet sein (siehe schema/README.md)."
            exit 1
          fi
          TEI_VERSION=$(python3 -c "import re; m = re.search(r'TEI Edition: P5 Version\s+([0-9]+\.[0-9]+\.[0-9]+)', open('schema/tei_all.rng', encoding='utf-8').read()); print(m.group(1) if m else '')")
          EXPECTED="4.11.0"
          if [ -z "$TEI_VERSION" ]; then
            echo "::error title=TEI P5 version pin::TEI-P5-Version konnte nicht aus schema/tei_all.rng extrahiert werden. Header-Format hat sich evtl. geaendert."
            exit 1
          fi
          if [ "$TEI_VERSION" != "$EXPECTED" ]; then
            echo "::error title=TEI P5 version drift::Committetes schema/tei_all.rng ist Version $TEI_VERSION, erwartet $EXPECTED (siehe schema/README.md). Beim bewussten P5-Upgrade EXPECTED + schema/README.md mitbumpen."
            exit 1
          fi
          echo "TEI P5 version: $TEI_VERSION (matches pin, committed schema)"

      - name: Freshness variants.xml (#125)
        run: |
          python scripts/sync/extract-variants.py --apply
          if ! git diff --exit-code -- authority-files/variants.xml; then
            echo "::error file=authority-files/variants.xml::variants.xml ist nicht mit dem Korpus synchron. Lokal 'python scripts/sync/extract-variants.py --apply' ausfuehren und mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            exit 1
          fi

      - name: Freshness API (#45)
        run: |
          python scripts/build-api.py
          # git status --porcelain statt git diff: faengt zusaetzlich
          # untracked Files (neuer Text -> neue api/texts/NEU.json), die
          # git diff ignoriert (spiegelt das #100-Pre-flight-Muster in
          # build-api.py check_working_tree()).
          if [ -n "$(git status --porcelain -- api/)" ]; then
            echo "::error file=api/index.json::api/ ist nicht mit den Indexen synchron (geaenderte ODER untracked Files). Lokal python scripts/build-api.py ausfuehren und mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            git status --porcelain -- api/
            exit 1
          fi

      - name: Freshness Indexe — Rebuild-and-Compare (#125)
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp data/corpus-index.json.gz data/authority-index.json.gz "$RUNNER_TEMP/committed/"
          python scripts/build-corpus-index.py
          python scripts/build-authority-index.py
          python - <<'EOF'
          import gzip, os, sys
          tmp = os.path.join(os.environ['RUNNER_TEMP'], 'committed')
          ok = True
          for name in ('corpus-index.json.gz', 'authority-index.json.gz'):
              with gzip.open(os.path.join('data', name), 'rb') as f:
                  fresh = f.read()
              with gzip.open(os.path.join(tmp, name), 'rb') as f:
                  committed = f.read()
              if fresh == committed:
                  print(f'{name}: OK (Rebuild byte-identisch nach Dekompression)')
              else:
                  print(f'::error file=data/{name}::{name} ist nicht mit dem Quellstand '
                        'synchron: Rebuild aus den aktuellen Quellen liefert anderen Inhalt. '
                        'Lokal rebuilden, Version bumpen und mitcommitten '
                        '(DATA-MODEL.md -> Data-Change-Lifecycle).')
                  ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Naming-Index Konsistenz (#152)
        run: |
          python - <<'EOF'
          import gzip, json, sys
          from pathlib import Path
          idx = json.load(gzip.open('data/naming-index.json.gz', 'rt', encoding='utf-8'))
          ok = True
          commit = idx.get('source', {}).get('commit', '')
          if not commit:
              print('::error file=data/naming-index.json.gz::naming-index ohne '
                    'source.commit — Provenienz verloren. Mit '
                    'scripts/ingest/naming/01-fetch-and-build-index.py '
                    '--require-commit rebuilden (#152).')
              ok = False
          works = idx.get('works', [])
          for work in works:
              sigle = work.get('sigle', '')
              if not (Path('tei') / f'{sigle}.tei.xml').exists():
                  print(f'::error file=data/naming-index.json.gz::naming-index '
                        f'referenziert Sigle "{sigle}", aber tei/{sigle}.tei.xml '
                        f'existiert nicht — Sigle-Rename ohne naming-Anpassung? '
                        f'Der Reader-Link im Playground braeche sonst still (#152).')
                  ok = False
          if ok:
              print(f'naming-index OK: source.commit={commit[:12]}, '
                    f'{len(works)} Werke, alle Sigles im Korpus.')
          sys.exit(0 if ok else 1)
          EOF

      - name: Freshness naming-index — Rebuild-and-Compare (#152)
        if: steps.base.outputs.naming_changed == 'true'
        # Rebuild aus dem im committeten Index gepinnten source.commit;
        # deterministisch (generatedAt = Committer-Datum des Pins), daher
        # muss der dekomprimierte Inhalt matchen. source.ref wird beim
        # Vergleich normalisiert ('master' im Committed vs. Pin-SHA im
        # Rebuild — Aufruf-Artefakt, kein Inhalt). GITHUB_TOKEN gegen das
        # IP-Rate-Limit unauthentifizierter api.github.com-Calls.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PIN=$(python -c "import gzip, json; print(json.load(gzip.open('data/naming-index.json.gz', 'rt', encoding='utf-8'))['source'].get('commit', ''))")
          if [ -z "$PIN" ]; then
            echo "::error file=data/naming-index.json.gz::naming-index ohne source.commit — Rebuild-and-Compare nicht moeglich (#152)."
            exit 1
          fi
          cp data/naming-index.json.gz "$RUNNER_TEMP/naming-committed.json.gz"
          python scripts/ingest/naming/01-fetch-and-build-index.py --ref "$PIN" --require-commit
          python - <<'EOF'
          import gzip, json, os, sys
          def load(path):
              idx = json.load(gzip.open(path, 'rt', encoding='utf-8'))
              idx.get('source', {}).pop('ref', None)
              return idx
          fresh = load('data/naming-index.json.gz')
          committed = load(os.path.join(os.environ['RUNNER_TEMP'], 'naming-committed.json.gz'))
          if fresh == committed:
              print('naming-index: OK (Rebuild aus gepinntem source.commit reproduziert den committeten Stand)')
              sys.exit(0)
          print('::error file=data/naming-index.json.gz::naming-index ist nicht '
                'aus seinem gepinnten source.commit reproduzierbar — Handedit, '
                'Format-Drift in der Quelle oder Skript-Aenderung ohne Rebuild '
                '(#152). Lokal scripts/ingest/naming/01-fetch-and-build-index.py '
                'ausfuehren und das Ergebnis committen.')
          sys.exit(1)
          EOF
          cp "$RUNNER_TEMP/naming-committed.json.gz" data/naming-index.json.gz

      - name: Authority cross-reference integrity (#44/#115/#152)
        run: python scripts/audit/check-authority-cross-refs.py --check

      - name: Validate corpus and authority files (P2-13)
        run: python scripts/audit/validate-corpus.py --fail-fast
