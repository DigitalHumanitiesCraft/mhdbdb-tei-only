name: Data Integrity

# Ein konsolidiertes Daten-Gate (#125): prueft Quellen UND abgeleitete
# Schicht (Indexe, variants.xml), Steps von billig nach teuer (fail fast).
# Konsolidiert das fruehere index-version-check.yml (Step 1) und
# schema-validation.yml (Steps 2-3, 7-8).
#
# Zwei Jobs seit #564 (E2), parallel auf getrennten Runnern. Vorher lief alles
# in einem Job und summierte sich auf median 475 s (letzte 25 erfolgreiche
# Laeufe): Checkout 72, RelaxNG-Validierung 212, Index-Rebuild 74, variants-
# Freshness 43, Cross-Refs 35, Rest unter 15 je Schritt. Die Schritte der
# beiden Gruppen haengen nicht voneinander ab, die Reihenfolge INNERHALB jeder
# Gruppe ist unveraendert (die MUSS-VOR-Step-6-Regeln unten gelten im Job
# freshness, wo der Rebuild data/ ueberschreibt).
#   Job validate:  Steps 1, 1a, 1b, 2, 3, 7b, 7c, 8
#                  (Schema- und Spiegel-Gates auf dem committeten Stand)
#   Job freshness: Steps 0, 1c, 1d, 4, 5, 5b, 6, 6b, 6c, 7
#                  (Variants-Flip-Gate und Index-Budget-Selbsttest gehoeren
#                  zu 1c/1d; alles, was Dateien neu baut und vergleicht)
# Rot ist, wenn ein Job rot ist. Jede Pruefung steht in genau einem Job;
# Checkout, Python-Setup und Dependency-Install stehen in beiden (voller
# Baum: sparse war hier langsamer). Zahlen: Dauer je Schritt aus der Actions-
# API (completed_at minus started_at je Job), letzte 25 Laeufe mit
# conclusion=success am 10.10.2026, Median.
#
#   0. Diff-Base bestimmen (PR: erster Elternteil des Merge-Refs,
#      Push: event.before) —
#      Grundlage fuer Step 1c und die Change-Detection in Step 6c.
#   1. Index-Versions-Konstanten: Build-Skripte und corpus-loader.js
#      muessen dieselbe Version nennen, sonst greift die Cache-
#      Invalidierung nicht (#47.3).
#   1a. Dokumentierte Zahlen gegen die Daten (#382/#398): jede in der
#      Doku und auf den ausgelieferten Seiten verankerte Zaehlung wird
#      gegen den Bestand gehalten. Frueh, weil billig (sechs Sekunden)
#      und ohne Abhaengigkeit von einem Vorgaenger. Die Pfadfilter hier
#      nennen docs/** (behauptete Zahl) nicht; seit 01.10.2026 deckt das
#      derselbe Schritt in no-cdn-check.yml ab, Begruendung am Step.
#   1b. Werk-Identifier gegen works.xml (#399): fuer
#      handschriftencensus, GND und wikidata ist works.xml Master, der
#      msIdentifier jedes TEI-Headers ist Spiegel. Verglichen wird
#      INHALT, nicht Formatierung: ein Sync-und-diff wuerde alle 667
#      Dateien ueber lxml neu serialisieren und das Gate dauerhaft rot
#      faerben. Rot auch bei fehlendem oder unparsebarem msIdentifier,
#      mit eigener Meldung, weil --works einen fehlenden Block nicht
#      anlegen kann. Frueh, weil billig (rund eine Sekunde ueber alle
#      667, gemessen 08.09.2026) und ohne Vorgaenger-Abhaengigkeit.
#   1c. Versions-Bump-Gate (#154): hat sich der dekomprimierte Inhalt
#      von corpus-/authority-index gegenueber der Diff-Base geaendert,
#      MUSS der version-String mitgebumpt sein — sonst invalidiert der
#      Dexie-Cache nicht und wiederkehrende Nutzer behalten bis zu 30
#      Tage den alten Index. MUSS VOR Step 6 (Freshness Indexe) laufen:
#      der Rebuild dort ueberschreibt data/*.json.gz im Working Tree.
#   1d. Index-Budget (#111, ADR-019), mit vorgeschaltetem Selbsttest
#      (--selftest) im eigenen Step: gz-Groesse fuer Leitung und Cache,
#      unkomprimierte Groesse fuer den Speicher nach JSON.parse. WARNT
#      nur und faerbt den Lauf nie rot; rot wird allein die gescheiterte
#      Messung. Steht wie 1c vor Step 6 (Freshness Indexe), damit der
#      committete Stand gemessen wird und nicht der frisch gebaute.
#   2. RNC->RNG sync check (P2-14).
#   3. TEI-P5-Versions-Pin fuer tei_all.rng.
#   4. Freshness variants.xml: extract-variants.py --apply muss die
#      committete Datei byte-identisch reproduzieren, sonst wurde nach
#      einer Korpus-Aenderung die Regenerierung vergessen. MUSS als
#      blockierender Step VOR Step 6 (Freshness Indexe) stehen: der
#      Index-Vergleich kann variants-Drift prinzipiell nicht erkennen
#      (der Rebuild nutzt dieselbe committete variants.xml und matcht).
#      Nie auf advisory herunterstufen. Derselbe Lauf bereinigt verwaiste
#      #type_N in lexicon.xml sense/@ana; auch dort muss der Diff leer sein.
#   5. Freshness API (#45): build-api.py muss das committete api/
#      byte-identisch reproduzieren (plain JSON, kein gzip — daher
#      reicht git diff). MUSS VOR Step 6 (Freshness Indexe) laufen: der
#      Index-Rebuild dort laesst data/*.json.gz mit potenziell anderen
#      gz-Bytes zurueck (je zlib-Build), was den build-api-Pre-flight
#      ("data/ muss clean sein") grundlos ausloesen wuerde.
#   5b. Freshness Begriffshilfe (#498): build-begriffshilfe.py muss
#      assets/downloads/mhdbdb-begriffshilfe.md byte-identisch
#      reproduzieren (liest concepts.xml, lexicon.xml und w/@ana im
#      Korpus; deterministisch, LF). Liest weder data/ noch git, die
#      Position ist frei; sie steht bei den uebrigen Freshness-Gates.
#   6. Freshness Indexe (Rebuild-and-Compare): beide Indexe frisch
#      bauen, DEKOMPRIMIERTEN Inhalt mit dem committeten Stand
#      vergleichen (gzip-Bytes koennen je zlib-Build variieren).
#      Traegt nur, weil die Builds seit #125 deterministisch sind
#      (kein generatedAt, sorted glob, gzip mtime=0).
#   6b. Naming-Index Konsistenz (#152): source.commit-Provenienz
#      vorhanden + alle works[].sigle existieren als tei/<SIG>.tei.xml
#      (ein Sigle-Rename braeche den Reader-Link sonst still als No-op).
#      Offline und billig, laeuft immer.
#   6c. Freshness naming-index (#152): Rebuild aus dem im Index
#      gepinnten source.commit muss den committeten Stand reproduzieren
#      (deterministisch: generatedAt = Committer-Datum des Pins).
#      Laeuft NUR, wenn naming-Pfade sich gegenueber der Diff-Base
#      geaendert haben — der Fetch geht an ein externes Repo
#      (lindabeutel/Naming-analysis), und externe Netz-Abhaengigkeit
#      auf jedem Daten-PR widerspraeche dem #125-Prinzip.
#   7. Authority cross-reference integrity (#44/#115/#152): dangling
#      Refs ausserhalb lexicon.xml brechen den Build; lexicon.xml wird
#      als ID-Set-Ratsche gegen die committete Baseline-Datei
#      (scripts/audit/lexicon-baseline.json) gegated: jede ID ausserhalb
#      der Baseline = rot, tolerierter Altbestand = gruen, geschrumpfter
#      Ist-Stand = ::warning mit --update-baseline-Hinweis. Vor der
#      Deutlich billiger als die RelaxNG-Validierung (plain parse); seit
#      #564 steht diese im anderen Job und beide laufen parallel.
#   7b. Personennamen im Header gegen persons.xml (#228/#308): der
#      zweite Spiegel neben dem msIdentifier aus Step 1b. Geprueft
#      werden titleStmt/author (leer, toter @ref, Praefixform) und
#      seit #308 particDesc/listPerson/persName[@type="preferred"],
#      adressiert ueber @corresp. Eine Abweichung dort ist nie eine
#      bibliographische Variante, sondern immer ein veralteter Spiegel.
#      Liest seit 01.10.2026 nur den teiHeader (unter einer Sekunde statt
#      rund einer Minute); die Position hier ist seither keine Kostenfrage.
#   7c. Gattungen im Header gegen works.xml (#495): die Hauptgattungen
#      in classDecl/taxonomy[@xml:id="genres"] muessen Werkgattungen
#      sein, und jede Werkgattung muss im Kopf stehen (als Haupt- oder
#      Elterngattung). Eine Gattung nur im Kopf kommt im Index nirgends
#      an. Neben 7b, als zweites Header-Gate; liest ebenfalls nur den
#      teiHeader.
#   8. Zweistufige RelaxNG-Validierung (P2-13): Stage 2
#      (mhdbdb.rng / mhdbdb-authority.rng) ist das harte Gate;
#      Stage-1-Baseline-Fails (#30) sind nur Warnungen.
#
# Die Nummerierung oben ist die dieser Datei und laeuft mit Buchstaben,
# damit ein spaeter eingefuegter Step seine Position zeigt, ohne die
# Ziffern darunter zu verschieben. Die Buchstaben verschiebt er sehr
# wohl: #399 hat 1b auf 1c und 1c auf 1d geschoben. Stehen bleibt 2
# bis 8. Sie entspricht NICHT der durchnummerierten Liste in
# docs/DEVELOPMENT.md (dort durchgezaehlt, ohne Buchstaben): dort ist der
# Index-Rebuild Pruefung 12, hier Step 6. Wer zwischen beiden Dateien
# springt, vergleicht Namen und nicht Nummern.
#
# Dependencies sind in requirements.txt gepinnt (CI und lokal dieselben
# Versionen): eine neue lxml-Serialisierung wuerde sonst in Step 4 als
# falscher Drift-Alarm erscheinen (variants.xml ist lxml-serialisiert;
# die Indexe sind reines json.dumps), eine neue rnc2rng-Version in
# Step 2. Bei Pin-Bump lokal `pip install -r requirements.txt` und
# variants.xml einmal regenerieren.

on:
  pull_request:
    paths:
      - 'schema/**'
      - 'tei/**'
      - 'authority-files/**'
      # Glob statt der drei Einzeldateien (#111): das Budget-Gate misst
      # jede data/*.json.gz und traegt fuer unbekannte Indexe eine eigene
      # Voreinstellung. Ein neuer kuratierter Index der #194-Rubrik waere
      # mit einer Namensliste am Gate vorbeigelaufen.
      - 'data/*.json.gz'
      - 'api/**'
      - '!api/index.html'
      - 'scripts/build-corpus-index.py'
      - 'scripts/build-authority-index.py'
      - 'scripts/build-api.py'
      - 'scripts/build-begriffshilfe.py'
      - 'assets/downloads/**'
      - 'scripts/mhg_normalizer.py'
      # Globs statt Einzeldateien: jedes hier ausgefuehrte Gate-Skript
      # soll seinen eigenen Aenderungs-Trigger haben (Review #146).
      - 'scripts/sync/**'
      - 'scripts/audit/**'
      - 'scripts/ingest/naming/**'
      - 'assets/js/lib/corpus-loader.js'
      - 'requirements.txt'
      - '.github/workflows/data-integrity.yml'
  # Direct-to-main pushes also trigger the workflow (Branch-Protection
  # ist historisch umgangen worden, z.B. WZB-Merge 2026-05-06).
  push:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'tei/**'
      - 'authority-files/**'
      # Glob statt der drei Einzeldateien (#111): das Budget-Gate misst
      # jede data/*.json.gz und traegt fuer unbekannte Indexe eine eigene
      # Voreinstellung. Ein neuer kuratierter Index der #194-Rubrik waere
      # mit einer Namensliste am Gate vorbeigelaufen.
      - 'data/*.json.gz'
      - 'api/**'
      - '!api/index.html'
      - 'scripts/build-corpus-index.py'
      - 'scripts/build-authority-index.py'
      - 'scripts/build-api.py'
      - 'scripts/build-begriffshilfe.py'
      - 'assets/downloads/**'
      - 'scripts/mhg_normalizer.py'
      - 'scripts/sync/**'
      - 'scripts/audit/**'
      - 'scripts/ingest/naming/**'
      - 'assets/js/lib/corpus-loader.js'
      - 'requirements.txt'
      - '.github/workflows/data-integrity.yml'
  workflow_dispatch:

concurrency:
  group: data-integrity-${{ github.ref }}
  # Nur PR-Laeufe canceln: bei main-Pushes vergleicht das Bump-Gate gegen
  # event.before — ein gecancelter Zwischen-Lauf liesse dessen Commit-Range
  # ungeprueft (Push1 aendert Index ohne Bump, Push2 cancelt Lauf1, Lauf2
  # sieht nur Push2s Range; Review PR #155). PR-Laeufe sind safe zu canceln,
  # der Ersatzlauf prueft immer den vollen Diff gegen den Base-Branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Checkout (grosses Repo, bis ~4 min) + RelaxNG-Validierung (rund
    # 3,5 min). 45 min lassen Luft fuer langsame Runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        # Voller Baum, ohne History: dieser Job liest tei/, authority-files/ und
        # schema/ ganz. Ein sparse-Checkout war hier langsamer (#564, E1).
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Index version consistency (#47.3)
        run: python scripts/audit/check-index-versions.py

      # Dokumentierte Zahlen gegen die Daten, die sie beschreiben.
      #
      # Position: frueh, weil billig. Sechs Sekunden lokal gemessen
      # (06.09.2026), und der Schritt haengt an keinem Vorgaenger:
      # doc-count-audit.py liest authority-files/*.xml und die Dateiliste aus
      # corpus_files() (nicht den geparsten Korpus).
      # Nach "Install dependencies" ist alles da. Der Workflow-Kopf schreibt
      # "Steps von billig nach teuer (fail fast)" aus; eine falsche Zahl auf
      # index.html darf nicht erst hinter der RelaxNG-Validierung auffallen.
      #
      # Seit 01.10.2026 laeuft derselbe Schritt AUCH in no-cdn-check.yml.
      # Frueher stand hier, warum nicht dort: das Skript brauchte lxml, und
      # no-cdn-check.yml ist stdlib-only. Es zaehlt jetzt mit ElementTree.
      # Hier bleibt es trotzdem, weil no-cdn-check.yml auf tei/** und
      # authority-files/** nicht anspringt: eine Datenaenderung ohne
      # Doku-Anteil faengt nur dieser Workflow.
      #
      # Warum ueberhaupt: das Skript gibt es seit Monaten und lief in keinem
      # Workflow. Am 06.09. hat der neu gepraegte type_372365 die
      # Variantenzahl von 256.761 auf 256.762 gehoben, und die alte Zahl
      # blieb an zehn Stellen stehen, zwei davon auf ausgelieferten Seiten
      # (index.html und hilfe-daten.html, beide fuer Besucher sichtbar).
      # Gefunden hat es der Review-Bot, nicht die CI.
      #
      # GRENZE dieses Workflows: Die Pfadfilter hier nennen weder docs/**
      # noch *.html. Ein PR, der nur Dokumentation anfasst, aendert die
      # BEHAUPTETE Zahl und loest den Lauf nicht aus; dann faellt die Drift
      # erst beim naechsten Datenlauf auf, in einem PR, der damit nichts zu
      # tun hat. Geschlossen ist das seit 01.10.2026 durch den Schritt in
      # no-cdn-check.yml, dessen Filter **.md und **/*.html nennen. Die
      # Beschreibung bleibt, weil sie erklaert, warum das Gate an zwei Stellen
      # steht. docs/** hier aufzunehmen kostete diesen 45-Minuten-Lauf bei
      # jeder Doku-Aenderung.
      #
      # Eine zweite Grenze (Aenderungen am Playground, die die GEMESSENE Zahl
      # verschoben) gab es, solange das Gate Werkzeug- und Modulzahlen aus
      # playground/ zaehlte. Seit #451 zaehlt es keine Zahl mehr, die aus dem
      # Playground-Code kommt.
      #
      # Der Fall vom 06.09. faellt nicht unter diese Grenze: er faengt
      # an einer Datenaenderung an und loest diesen Workflow immer aus.
      - name: Dokumentierte Zahlen gegen die Daten (#382/#398)
        run: python scripts/audit/doc-count-audit.py --check

      # Haelt den msIdentifier jeder Korpusdatei gegen works.xml (#399).
      # Verglichen wird der INHALT der gespiegelten idno, nicht die
      # Formatierung: ein "Sync laufen lassen und diffen" waere dauerhaft rot,
      # weil der lxml-Schreibpfad jede Datei neu serialisiert (gemessen
      # 07.09.2026: alle 667 geaendert, Korpus 1.432,5 -> 1.430,6 MB).
      # Billig und offline: liest je Datei nur bis zum Ende des
      # msIdentifier (iterparse), rund eine Sekunde ueber alle 667.
      - name: Werk-Identifier gegen works.xml (#399)
        run: python scripts/sync/sync_tei_headers.py --works --check

      - name: Regenerate RNG from RNC (P2-14 drift check)
        run: |
          python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng
          python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng

      - name: Fail if committed .rng differs from regenerated .rng
        run: |
          if ! git diff --exit-code schema/mhdbdb.rng schema/mhdbdb-authority.rng; then
            echo "::error title=RNG drift::Committete .rng-Dateien sind nicht synchron mit ihren .rnc-Quellen. Lokal 'python -m rnc2rng schema/mhdbdb.rnc schema/mhdbdb.rng && python -m rnc2rng schema/mhdbdb-authority.rnc schema/mhdbdb-authority.rng' ausfuehren und das Ergebnis committen."
            exit 1
          fi

      - name: Verify TEI P5 version pin
        # tei_all.rng is committed to the repo (schema/tei_all.rng, see
        # schema/README.md) — NO download from tei-c.org at build time, so
        # the CI does not depend on upstream reachability (reproducible
        # builds, #125; previously a tei-c.org outage failed every run).
        # This step is a sanity check that the committed schema still
        # carries the pinned version; it catches an accidental replacement
        # with a different P5 version. Upgrading P5 is a deliberate act:
        # replace schema/tei_all.rng and bump EXPECTED + schema/README.md.
        #
        # NOTE: the version header in tei_all.rng contains a literal
        # NBSP (U+00A0, UTF-8 bytes C2 A0) between "Version" and the
        # number, so a naive `grep -oE 'Version [0-9.]+'` with a
        # regular space does NOT match. Python's re.search with \s
        # handles that correctly since Python 3.
        run: |
          if [ ! -f schema/tei_all.rng ]; then
            echo "::error title=TEI schema missing::schema/tei_all.rng fehlt im Repo. Die Datei muss committet sein (siehe schema/README.md)."
            exit 1
          fi
          TEI_VERSION=$(python3 -c "import re; m = re.search(r'TEI Edition: P5 Version\s+([0-9]+\.[0-9]+\.[0-9]+)', open('schema/tei_all.rng', encoding='utf-8').read()); print(m.group(1) if m else '')")
          EXPECTED="4.11.0"
          if [ -z "$TEI_VERSION" ]; then
            echo "::error title=TEI P5 version pin::TEI-P5-Version konnte nicht aus schema/tei_all.rng extrahiert werden. Header-Format hat sich evtl. geaendert."
            exit 1
          fi
          if [ "$TEI_VERSION" != "$EXPECTED" ]; then
            echo "::error title=TEI P5 version drift::Committetes schema/tei_all.rng ist Version $TEI_VERSION, erwartet $EXPECTED (siehe schema/README.md). Beim bewussten P5-Upgrade EXPECTED + schema/README.md mitbumpen."
            exit 1
          fi
          echo "TEI P5 version: $TEI_VERSION (matches pin, committed schema)"

      # Zweiter Header-Spiegel neben dem msIdentifier aus Step 1b (#308):
      # titleStmt/author und particDesc/listPerson spiegeln persons.xml.
      # Lief bis heute bewusst nicht mit, solange der tote @ref in VOR offen
      # war (so in scripts/README.md vermerkt); der ist mit #308 behoben, das
      # Skript steht auf exit 0, damit faellt die Begruendung weg.
      # Stand frueher hier und nicht oben bei 1b, weil es jede der 667 Dateien
      # ganz parste (1 min 47 s); seit 01.10.2026 liest es per iterparse nur
      # den teiHeader wie 1b, die Position ist seither keine Kostenfrage.
      - name: Personennamen im Header gegen persons.xml (#228/#308)
        run: python scripts/audit/check-author-refs.py --check

      # Gattungen im Header gegen works.xml (#495). Fuenf Frauendienst-Koepfe
      # sind als Ausnahme benannt, bis KZW ueber work_6 entschieden hat; das
      # Skript meldet die Ausnahme als veraltet, sobald sie nicht mehr passt.
      - name: Gattungen im Header gegen works.xml (#495)
        run: python scripts/audit/check-header-genres.py --check

      - name: Validate corpus and authority files (P2-13)
        run: python scripts/audit/validate-corpus.py --fail-fast

  # Zweiter Job (#564, E2): die Rebuild-and-Compare-Pruefungen laufen parallel zu
  # den Schema- und Spiegel-Gates oben, auf einem eigenen Runner. Die Schritte
  # stehen in der Reihenfolge, die ihre Abhaengigkeiten verlangen (Kopf der Datei).
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # fetch-depth: 2, damit der Diff-Base-Schritt unten den ersten
        # Elternteil des Merge-Refs lesen kann. Mit der Voreinstellung 1
        # kappt die shallow-Grenze die Elternliste, und `HEAD^1` scheitert.
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Diff-Base bestimmen (#154/#152)
        id: base
        # Liefert sha = Vergleichsstand fuer das Versions-Bump-Gate und
        # die naming-Change-Detection. Leerer sha (workflow_dispatch,
        # Force-Push-Edge) -> Bump-Gate wird uebersprungen, naming-Check
        # laeuft konservativ.
        #
        # Achtung, falls hier je eine Merge-Queue dazukommt: `merge_group`
        # faellt durch beide Zweige unten durch, BASE bliebe leer, und das
        # Bump-Gate wuerde still uebersprungen. Wer den Trigger ergaenzt,
        # muss diesen Schritt also mitbehandeln.
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Erster Elternteil des ausgecheckten Merge-Refs, also per
            # Konstruktion der Stand, gegen den gemergt wurde. Die zwei
            # naheliegenden Alternativen sind beide gemessen falsch: der
            # aktuelle Tip von $GITHUB_BASE_REF laeuft weiter, waehrend der
            # Lauf wartet (Lauf 30744220171: ausgecheckt "Merge 52a83d3 into
            # b8b44eb", Base d835e8f, weil PR #338 98 Sekunden spaeter
            # gemergt wurde), und pull_request.base.sha haengt hinterher
            # (Folgelauf 30744745366: ausgecheckt gegen d835e8f, base.sha
            # weiter b8b44eb). In beiden Faellen galt, was ein fremder PR
            # geaendert hatte, als Aenderung dieses PRs, hier also mit einem
            # eingeforderten Versions-Bump, den der PR nicht schuldet.
            #
            # Braucht fetch-depth 2 im Checkout: mit der Voreinstellung 1
            # kappt die shallow-Grenze die Elternliste. Kein Netzzugriff,
            # also auch kein Retry mehr noetig (der stand hier gegen
            # transiente Fetch-Fehler). Achtung: auch Kommentare im run-Block
            # werden auf Expressions gescannt, leere Doppelklammer-
            # Ausdruecke crashen hier den Workflow-Parse.
            BASE=$(git rev-parse --verify --quiet HEAD^1) || BASE=""
            if [ -z "$BASE" ]; then
              echo "::error title=Diff-Base::Erster Elternteil des Merge-Refs nicht lesbar (fetch-depth zu klein?)."
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
              BASE=""
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          if [ -z "$BASE" ] \
             || ! git diff --quiet "$BASE" HEAD -- data/naming-index.json.gz scripts/ingest/naming/; then
            echo "naming_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "naming_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Diff-Base: ${BASE:-<keine>} / naming_changed siehe Output"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Index-Versions-Bump-Gate (#154)
        # MUSS vor dem Index-Rebuild (Step 6 der Liste im Kopf) laufen:
        # der ueberschreibt data/*.json.gz im Working Tree.
        run: |
          if [ -z "${{ steps.base.outputs.sha }}" ]; then
            echo "::notice title=Versions-Bump-Gate::Kein Diff-Base bestimmbar (workflow_dispatch/Force-Push) — Gate uebersprungen."
          else
            python scripts/audit/check-index-version-bump.py --base "${{ steps.base.outputs.sha }}"
          fi

      - name: Variants-Flip-Gate (#378, ADR-021)
        # Wie das Bump-Gate vor dem Index-Rebuild: gemessen wird der committete Stand.
        run: |
          if [ -n "${{ steps.base.outputs.sha }}" ]; then python scripts/audit/check-variants-flips.py --base "${{ steps.base.outputs.sha }}"; fi

      # Wie das Bump-Gate darueber vor dem Index-Rebuild (Step 6 der Liste
      # im Kopf): der ueberschreibt data/*.json.gz im Working Tree.
      # Gemessen werden soll der committete Stand, also das, was
      # ausgeliefert wird.
      - name: Index-Budget Selbsttest (#111)
        # Dieses Gate wird auf absehbare Zeit nichts melden (Korpus-Index
        # heute bei 84 Prozent Auslastung). Ohne Selbsttest wuesste niemand,
        # ob es noch misst, was es messen soll.
        run: python scripts/audit/check-index-budget.py --selftest

      - name: Index-Budget (#111)
        # Warnt nur, faerbt den Lauf nie rot (Entscheidung Chris, 08.08.2026):
        # der Index waechst durch legitime Annotationsarbeit, und ein rotes
        # Gate wuerde den naechsten Backfill blockieren, bis jemand ein
        # Splitting gebaut hat. Rot wird der Schritt nur, wenn die Messung
        # selbst scheitert.
        run: python scripts/audit/check-index-budget.py

      - name: Freshness variants.xml (#125)
        run: |
          python scripts/sync/extract-variants.py --apply
          if ! git diff --exit-code -- authority-files/variants.xml; then
            echo "::error file=authority-files/variants.xml::variants.xml ist nicht mit dem Korpus synchron. Lokal 'python scripts/sync/extract-variants.py --apply' ausfuehren und mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            exit 1
          fi
          # --apply bereinigt auch verwaiste #type_N in lexicon.xml sense/@ana.
          # Ohne diesen Diff saehe das Cross-Ref-Gate weiter unten nur noch den
          # hier bereinigten Stand und bliebe auf einem verwaisten Commit gruen.
          if ! git diff --exit-code -- authority-files/lexicon.xml; then
            echo "::error file=authority-files/lexicon.xml::lexicon.xml fuehrt in sense/@ana Typ-Tokens, die variants.xml nicht kennt. Lokal 'python scripts/sync/extract-variants.py --apply' ausfuehren und lexicon.xml mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            exit 1
          fi

      - name: Freshness API (#45)
        run: |
          python scripts/build-api.py
          # git status --porcelain statt git diff: faengt zusaetzlich
          # untracked Files (neuer Text -> neue api/texts/NEU.json), die
          # git diff ignoriert (spiegelt das #100-Pre-flight-Muster in
          # build-api.py check_working_tree()).
          if [ -n "$(git status --porcelain -- api/)" ]; then
            echo "::error file=api/index.json::api/ ist nicht mit den Indexen synchron (geaenderte ODER untracked Files). Lokal python scripts/build-api.py ausfuehren und mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            git status --porcelain -- api/
            exit 1
          fi

      - name: Freshness Begriffshilfe (#498)
        run: |
          python scripts/build-begriffshilfe.py
          # git status --porcelain wie beim API-Step: faengt geaenderte und
          # untracked Files. Die Datei ist deterministisch (kein Datum, kein
          # Commit, LF), abhaengig von concepts.xml, lexicon.xml und w/@ana.
          if [ -n "$(git status --porcelain -- assets/downloads/)" ]; then
            echo "::error file=assets/downloads/mhdbdb-begriffshilfe.md::Die Begriffshilfe ist nicht mit concepts.xml, lexicon.xml und dem Korpus synchron. Lokal python scripts/build-begriffshilfe.py ausfuehren und mitcommitten (DATA-MODEL.md -> Data-Change-Lifecycle)."
            git status --porcelain -- assets/downloads/
            exit 1
          fi

      - name: Freshness Indexe — Rebuild-and-Compare (#125)
        run: |
          mkdir -p "$RUNNER_TEMP/committed"
          cp data/corpus-index.json.gz data/authority-index.json.gz "$RUNNER_TEMP/committed/"
          python scripts/build-corpus-index.py
          python scripts/build-authority-index.py
          python - <<'EOF'
          import gzip, os, sys
          tmp = os.path.join(os.environ['RUNNER_TEMP'], 'committed')
          ok = True
          for name in ('corpus-index.json.gz', 'authority-index.json.gz'):
              with gzip.open(os.path.join('data', name), 'rb') as f:
                  fresh = f.read()
              with gzip.open(os.path.join(tmp, name), 'rb') as f:
                  committed = f.read()
              if fresh == committed:
                  print(f'{name}: OK (Rebuild byte-identisch nach Dekompression)')
              else:
                  print(f'::error file=data/{name}::{name} ist nicht mit dem Quellstand '
                        'synchron: Rebuild aus den aktuellen Quellen liefert anderen Inhalt. '
                        'Lokal rebuilden, Version bumpen und mitcommitten '
                        '(DATA-MODEL.md -> Data-Change-Lifecycle).')
                  ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Naming-Index Konsistenz (#152)
        run: python scripts/audit/check-naming-index.py

      - name: Freshness naming-index — Rebuild-and-Compare (#152)
        if: steps.base.outputs.naming_changed == 'true'
        # Rebuild aus dem im committeten Index gepinnten source.commit;
        # deterministisch (generatedAt = Committer-Datum des Pins), daher
        # muss der dekomprimierte Inhalt matchen. source.ref wird beim
        # Vergleich normalisiert ('master' im Committed vs. Pin-SHA im
        # Rebuild — Aufruf-Artefakt, kein Inhalt). GITHUB_TOKEN gegen das
        # IP-Rate-Limit unauthentifizierter api.github.com-Calls.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Pin-Existenz garantiert der Konsistenz-Step davor (laeuft immer,
          # failt hart bei fehlendem source.commit).
          PIN=$(python scripts/audit/check-naming-index.py --print-source-commit)
          cp data/naming-index.json.gz "$RUNNER_TEMP/naming-committed.json.gz"
          python scripts/ingest/naming/01-fetch-and-build-index.py --ref "$PIN" --require-commit
          python - <<'EOF'
          import gzip, json, os, sys
          def load(path):
              idx = json.load(gzip.open(path, 'rt', encoding='utf-8'))
              idx.get('source', {}).pop('ref', None)
              return idx
          fresh = load('data/naming-index.json.gz')
          committed = load(os.path.join(os.environ['RUNNER_TEMP'], 'naming-committed.json.gz'))
          if fresh == committed:
              print('naming-index: OK (Rebuild aus gepinntem source.commit reproduziert den committeten Stand)')
              sys.exit(0)
          print('::error file=data/naming-index.json.gz::naming-index ist nicht '
                'aus seinem gepinnten source.commit reproduzierbar — Handedit, '
                'Format-Drift in der Quelle oder Skript-Aenderung ohne Rebuild '
                '(#152). Lokal scripts/ingest/naming/01-fetch-and-build-index.py '
                'ausfuehren und das Ergebnis committen.')
          sys.exit(1)
          EOF

      - name: Authority cross-reference integrity (#44/#115/#152)
        run: python scripts/audit/check-authority-cross-refs.py --check
