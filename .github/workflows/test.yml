name: MHDBDB Playground Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'playground/**'
      - 'authority-files/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'playground/**'
      - 'authority-files/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm init -y
        npm install --save-dev @playwright/test http-server

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Start HTTP server
      run: |
        npx http-server . -p 8080 -c-1 &
        echo "HTTP_SERVER_PID=$!" >> $GITHUB_ENV
        # Wait for server to start
        sleep 3
        curl -f http://localhost:8080/playground/test.html || exit 1

    - name: Run Playwright tests
      run: npx playwright test --config=playwright.config.js

    - name: Generate test report
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        if [ -f "test-results/report.json" ]; then
          node -e "
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
            console.log(\`### Summary\`);
            console.log(\`- **Total Tests**: \${report.summary.total}\`);
            console.log(\`- **Passed**: \${report.summary.passed} ✅\`);
            console.log(\`- **Failed**: \${report.summary.failed} ❌\`);
            console.log(\`- **Pass Rate**: \${report.summary.passRate}%\`);
            console.log(\`- **Duration**: \${report.summary.duration}ms\`);
            if (report.summary.failed > 0) {
              console.log(\`\n### Failed Tests\`);
              report.results.filter(r => r.status === 'fail').forEach(test => {
                console.log(\`- **\${test.suite}**: \${test.test}\`);
                console.log(\`  - Error: \${test.error}\`);
              });
            }
          " >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test report generated" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 7

    - name: Stop HTTP server
      if: always()
      run: |
        if [ ! -z "$HTTP_SERVER_PID" ]; then
          kill $HTTP_SERVER_PID || true
        fi
        pkill -f "http-server" || true

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let comment = '## 🧪 Test Results\n\n';

          try {
            const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
            const status = report.summary.failed === 0 ? '✅ All tests passed!' : '❌ Some tests failed';

            comment += `${status}\n\n`;
            comment += `| Metric | Value |\n`;
            comment += `|--------|-------|\n`;
            comment += `| Total Tests | ${report.summary.total} |\n`;
            comment += `| Passed | ${report.summary.passed} ✅ |\n`;
            comment += `| Failed | ${report.summary.failed} ❌ |\n`;
            comment += `| Pass Rate | ${report.summary.passRate}% |\n`;
            comment += `| Duration | ${report.summary.duration}ms |\n`;

            if (report.summary.failed > 0) {
              comment += '\n### Failed Tests\n';
              report.results.filter(r => r.status === 'fail').forEach(test => {
                comment += `- **${test.suite}**: ${test.test}\n`;
                comment += `  - \`${test.error}\`\n`;
              });
            }
          } catch (error) {
            comment += '⚠️ Could not parse test results\n';
            comment += `Error: ${error.message}`;
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });