name: Claude Code Review

on:
  pull_request:
    # closed ist nur der Cancel-Hebel: der Merge/Close-Event betritt die
    # Concurrency-Group und bricht damit ein noch laufendes Review ab
    # (sonst postet es verspätet auf den gemergten PR); der Job selbst
    # wird via if unten übersprungen.
    types: [opened, synchronize, ready_for_review, closed]
    # Optional: nur bei bestimmten Dateiänderungen laufen lassen
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

# Pro PR nur ein laufendes Review: neuer Push bricht das alte ab (Kosten!)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # KEIN use_sticky_comment. Am 30.07. eingeschaltet und nach einem
          # halben Tag wieder entfernt, damit es niemand erneut vorschlägt:
          #
          # Es tut, was es verspricht (ein Kommentar pro PR statt einer pro
          # Lauf; PR #254 hatte am 29.07. acht). Der Preis ist aber höher als
          # die Thread-Länge. Zusammen mit track_progress überschreibt der
          # jeweils nächste Lauf den Kommentar zuerst mit seiner
          # Fortschritts-Checkliste: der letzte Befund ist genau dann
          # unsichtbar, wenn man ihn nachlesen will. Und die früheren Runden
          # liegen danach ausschließlich in der Edit-Historie des Kommentars,
          # also nur im Browser. Über die API und `gh` sind sie nicht mehr
          # erreichbar, im Job-Log stehen sie auch nicht (die Action postet
          # direkt per API). Bei #253 sind an einem Tag vier Runden gelaufen,
          # jede mit einem echten Befund, und alle vier wurden per `gh api`
          # gelesen und abgearbeitet. Redundante Kommentare sind billiger als
          # verlorene Prüfspuren.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model opus
            --max-turns 50
            --append-system-prompt "Dieser PR hat wahrscheinlich schon Review-Runden hinter sich. Lies zuerst die bestehenden Kommentare (gh pr view <nr> --comments) und melde nichts erneut, was dort bereits steht und behandelt wurde: weder als Wiederholung noch als Neuformulierung. Zähle die vorhandenen Review-Kommentare; ab der dritten Runde meldest du nur noch Befunde mit Verhaltenswirkung. Eine leere Befundliste ist ein gültiges und erwünschtes Ergebnis. Behauptungen in Kommentaren, Doku und PR-Body meldest du nur, wenn du die Abweichung selbst gemessen hast, und nennst das Kommando dazu."
