name: Claude Code Review

on:
  pull_request:
    # closed ist nur der Cancel-Hebel: der Merge/Close-Event betritt die
    # Concurrency-Group und bricht damit ein noch laufendes Review ab
    # (sonst postet es verspätet auf den gemergten PR); der Job selbst
    # wird via if unten übersprungen.
    types: [opened, synchronize, ready_for_review, closed]
    # Optional: nur bei bestimmten Dateiänderungen laufen lassen
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"

# Pro PR nur ein laufendes Review: neuer Push bricht das alte ab (Kosten!)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --model opus
            --max-turns 50
